apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: pipelinemedic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: pipelinemedic-backend:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: pipelinemedic-config
            - secretRef:
                name: pipelinemedic-secret
          command: ["python", "-m", "app.worker"]
