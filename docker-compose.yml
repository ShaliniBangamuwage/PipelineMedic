services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pipelinemedic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pipelinemedic"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./apps/backend
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/pipelinemedic
      FRONTEND_URL: http://localhost,http://localhost:5173
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      AUTH_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      PYTHONPATH: /app
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  worker:
    build: ./apps/backend
    command: ["python", "-m", "app.worker"]
    env_file:
      - ./apps/backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/pipelinemedic
      FRONTEND_URL: http://localhost,http://localhost:5173
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      AUTH_ENABLED: "true"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, redis; r = redis.Redis.from_url('redis://redis:6379/0'); sys.exit(0 if r.ping() else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
  frontend:
    build:
      context: ./apps/frontend
      args:
        VITE_AUTH_ENABLED: "true"
        VITE_API_BASE_URL: http://localhost:8000/api
    ports: ["80:80"]
    depends_on: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
