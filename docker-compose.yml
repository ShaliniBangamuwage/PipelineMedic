services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pipelinemedic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pipelinemedic"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./apps/backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/pipelinemedic
      FRONTEND_URL: http://localhost
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./apps/frontend
    ports: ["80:80"]
    depends_on: [backend]
